<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>登录验证码</title></head>
  <body>
    <h2>带饭营养规划 · 邮箱验证</h2>
    <p>请输入以下验证码完成注册或登录：</p>
    <p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p>验证码 10 分钟内有效，仅可使用一次。请勿将验证码告知他人。</p>
    <p>如果你没有请求此验证码，请忽略本邮件。</p>
  </body>
</html>
